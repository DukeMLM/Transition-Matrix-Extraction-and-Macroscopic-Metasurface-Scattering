[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmatrix"
version = "0.1.0"
description = "T-matrix extraction and aggregation for metasurfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    # 1.15 is the first release with scipy.special.sph_harm_y, which
    # aggregation/vswf.py imports at module level
    "scipy>=1.15",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# treams is the independent Ewald cross-check; the core pipeline does not
# need it, but treams_*.py does.
reference = ["treams>=0.3"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tmatrix.aggregation.webview" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites under tests/aggregation are standalone
# scripts with their own PASS/FAIL reporting; tests/test_suites.py runs each
# one and asserts its exit status.  See its docstring for why.
python_files = ["test_suites.py"]
markers = [
    "slow: suites that take minutes (search-heavy or CST-sized); deselect with -m 'not slow'",
    "treams: needs the optional treams dependency",
    "cst: needs a local CST installation and its run directories",
]
